name: Build Whisper P2P Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Extract uploaded project ZIP if repository contains only the archive
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            archive=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
            if [ -z "$archive" ]; then
              echo "No package.json or project ZIP found at repository root."
              exit 1
            fi
            mkdir -p /tmp/whisper-project
            unzip -q "$archive" -d /tmp/whisper-project
            cp -a /tmp/whisper-project/. .
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Install Capacitor Android tooling
        run: npm install @capacitor/core@^7 @capacitor/android@^7 && npm install --save-dev @capacitor/cli@^7
      - name: Build web app
        run: npm run build
      - name: Initialize Capacitor
        run: npx cap init "Whisper P2P" "com.whisperp2p.app" --web-dir dist
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets to Android
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-p2p-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
